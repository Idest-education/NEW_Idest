services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: idest
      POSTGRES_PASSWORD: idest
      POSTGRES_DB: idest_clerk
    ports:
      - "5432:5432"
    volumes:
      - idest-pg:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro

volumes:
  idest-pg:
