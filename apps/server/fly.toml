app = "idest-server"
primary_region = "sin"

[build]

[deploy]
  release_command = "pnpm --filter server exec prisma migrate deploy"

[env]
  PORT = "3001"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "10s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/docs"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
