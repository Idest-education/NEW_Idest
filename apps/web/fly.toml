app = "idest-web"
primary_region = "sin"

[build]
  [build.args]
    # Public by design; the secret half lives in idest-server's TURNSTILE_SECRET.
    NEXT_PUBLIC_TURNSTILE_SITE_KEY = "0x4AAAAAAFUpeNNUHsO7kS29"

[env]
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "10s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
